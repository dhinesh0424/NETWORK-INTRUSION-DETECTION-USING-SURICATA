# Settings to apply in /etc/suricata/suricata.yaml (02_configure.sh does this automatically).
vars:
  address-groups:
    HOME_NET: "[192.168.56.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

af-packet:
  - interface: enp0s3
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

outputs:
  - fast:
      enabled: yes
      filename: fast.log
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json

default-rule-path: /var/lib/suricata/rules
rule-files:
  - suricata.rules
  - local.rules
